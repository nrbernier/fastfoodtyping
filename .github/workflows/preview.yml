name: Request preview deploy

# GitHub Pages only deploys from main, so a push to any other branch asks the
# main deploy to run again; it rebuilds the site with that branch's preview.
on:
  push:
    branches-ignore: [main]

permissions:
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
